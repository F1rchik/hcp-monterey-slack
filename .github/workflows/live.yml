name: Hourly — approved estimates & new leads

on:
  schedule:
    # Every hour at :17, around the clock. GitHub drops scheduled runs under load
    # (worst at :00), and in practice ran this only 2–5 times a day with gaps up
    # to 14.5h. Off-peak minute + 24 tries/day keeps posts close to hourly; the
    # 72h lookback in config.yaml means a skipped run delays a post, never loses it.
    # Actions budget: ~24 runs/day ≈ 720 billed minutes/month on a private repo.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print instead of posting'
        type: boolean
        default: false
      test_channel:
        description: 'Test: post everything to this channel ID instead'
        type: string
        default: ''

concurrency:
  # Two overlapping runs would both read history before either posts.
  group: hcp-live
  cancel-in-progress: false

jobs:
  run:
    # Schedule is off until Variable HCP_ENABLED=true; manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.HCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/main.py live
        env:
          HCP_API_KEY: ${{ secrets.HCP_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SLACK_TEST_CHANNEL: ${{ inputs.test_channel }}
