name: Daily — yesterday's jobs per technician

on:
  # No schedule here any more. GitHub ran scheduled jobs only 4-7 times a day
  # (gaps up to 8h), so production runs from Windows Task Scheduler on the ETL VM
  # (scripts/run_bot.ps1 daily). Keep this workflow for manual runs and as a fallback;
  # don't add a schedule back while the VM task is active, or both would post.
  workflow_dispatch:
    inputs:
      date:
        description: 'Report this day instead of yesterday (YYYY-MM-DD)'
        type: string
        default: ''
      dry_run:
        description: 'Print instead of posting'
        type: boolean
        default: false
      test_channel:
        description: 'Test: post to this channel ID instead of #chat-monterey'
        type: string
        default: ''

concurrency:
  group: hcp-daily
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.HCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/main.py daily ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          HCP_API_KEY: ${{ secrets.HCP_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SLACK_TEST_CHANNEL: ${{ inputs.test_channel }}
