name: Daily — yesterday's jobs per technician

on:
  schedule:
    # Hourly tries 14:23–20:23 UTC (07:23–13:23 PDT / 06:23–12:23 PST). GitHub
    # drops many scheduled runs, so several tries are needed for one to land.
    # The code posts only once local time is past daily.post_after (07:00) and
    # skips technicians already posted for that day, so extra runs do nothing.
    - cron: '23 14-20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Report this day instead of yesterday (YYYY-MM-DD)'
        type: string
        default: ''
      dry_run:
        description: 'Print instead of posting'
        type: boolean
        default: false
      test_channel:
        description: 'Test: post to this channel ID instead of #chat-monterey'
        type: string
        default: ''

concurrency:
  group: hcp-daily
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.HCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/main.py daily ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          HCP_API_KEY: ${{ secrets.HCP_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SLACK_TEST_CHANNEL: ${{ inputs.test_channel }}
