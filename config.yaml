# HCP → Slack notifications for FUSE HVAC & APPLIANCE REPAIR MONTEREY INC.
# Everything a manager may want to change lives here; secrets live in .env / GitHub.

timezone: America/Los_Angeles

# The HCP API key is for the Fuse parent account; this picks the Monterey location
# (sent as X-Company-Id). Other locations: GET /company → locations.
hcp_company_id: "8e8a0455-fbd1-4542-ad55-aa90756c5ca6"   # FUSE HVAC & APPLIANCE REPAIR MONTEREY INC

# Channel IDs, not names: all three are private, and an ID can't drift when a channel
# is renamed. Slack: open the channel → name at the top → the ID is at the bottom
# of the About tab. The bot must be invited into each one (/invite @<bot>).
channels:
  estimates: ""   # #fuse-monterey-parts   — every approved estimate
  leads: ""       # #fuse_monterey_leads   — every new lead
  daily: ""       # #chat-monterey         — yesterday's jobs per technician

# Links under each approved estimate. {id} is the HCP estimate / job id.
# Empty = no link. The /app/estimates/{id} and /app/jobs/{id} guesses were broken;
# fill in once the real URL pattern is copied from the HCP browser address bar.
links:
  estimate: ""
  job: ""

# Live run (approved estimates + new leads).
live:
  # How far back each run looks. Anything older was either posted already or is
  # older than we care about; Slack history makes repeats impossible either way.
  # Generous because GitHub cron runs are routinely 30–60 min late.
  lookback_hours: 6
  # Estimates are scanned by creation date; an approval of an estimate older than
  # this is missed. 60 days covers the usual "customer thinks it over" gap.
  estimate_max_age_days: 60

# Daily report: yesterday's jobs, posted once, after this local time.
daily:
  post_after: "07:00"

# Lead source → Slack header. First entry whose `match` text appears in HCP's
# lead_source wins (case-insensitive). Emoji must exist in the workspace.
lead_sources:
  - label: Yelp
    emoji: ":yelp:"
    match: [yelp]
  - label: Thumbtack
    emoji: ":thumbtack:"
    match: [thumbtack]
  - label: GLS
    emoji: ":googleads:"
    match: [google, gls, lsa, local services]
  - label: eLocal
    emoji: ":elocal-house:"
    match: [elocal]
  - label: Angi
    # Built-in emoji: there is no custom :angi: in the workspace. Swap for a custom
    # one if someone uploads the Angi logo.
    emoji: ":house_with_garden:"
    match: [angi]
default_lead_source:
  label: HCP
  emoji: ":fuse:"

